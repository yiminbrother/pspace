spring.application.name=pspace

# 서브 포트
server.port=80

# 터미널 칼라 출력
spring.output.ansi.enabled=ALWAYS

# 로그 출력 패턴
logging.pattern.console=%clr(%-5level){green} %clr(%logger{15}.%M\\(\\)){cyan}: %msg %n
logging.level.root=INFO

# 파일 업로드
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB


# DataSource(Database) 연결 설정
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${POSTGRE_ID}
spring.datasource.password=${POSTGRE_PASSWORD}

# MyBatis 설정
# 공통 설정 파일 (타입 별칭, 언더스코어 자동 매핑, NULL 처리)
mybatis.config-location=classpath:mybatis/mybatis_config.xml
# SQL 매퍼 XML 파일 위치
mybatis.mapper-locations=classpath:mybatis/mapper/*.xml
